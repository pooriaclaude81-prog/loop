<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emergency Orders Quick Access</title>
<meta name="description" content="Fast-access emergency physician orders grouped by condition, with scenarios, branches and source consensus.">
<style>
:root{
  --bg:#f6f7f9;--card:#ffffff;--ink:#14181f;--mute:#5a6472;--line:#d9dee5;
  --link:#0b57d0;--l1:#b3261e;--l2:#b25e00;--l3:#1b6e3c;
  --amber-bg:#fff4d6;--amber-ink:#6b4a00;--amber-line:#e6c25a;
  --blue-bg:#e8f0fe;--red-bg:#fde9e7;--green-bg:#e6f4ea;--grey-bg:#eef1f4;
  --sa:#7a3db8;--sb:#00796b;--sab:#14181f;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318;--card:#181e26;--ink:#e8ecf1;--mute:#9aa6b4;--line:#2c3541;
    --link:#8ab4f8;--l1:#ff8a80;--l2:#ffb74d;--l3:#81c995;
    --amber-bg:#3a2f10;--amber-ink:#ffe08a;--amber-line:#7a6320;
    --blue-bg:#16263f;--red-bg:#3b1c1a;--green-bg:#17301f;--grey-bg:#212934;
    --sa:#c9a0f0;--sb:#6fd3c4;--sab:#e8ecf1;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318;--card:#181e26;--ink:#e8ecf1;--mute:#9aa6b4;--line:#2c3541;
  --link:#8ab4f8;--l1:#ff8a80;--l2:#ffb74d;--l3:#81c995;
  --amber-bg:#3a2f10;--amber-ink:#ffe08a;--amber-line:#7a6320;
  --blue-bg:#16263f;--red-bg:#3b1c1a;--green-bg:#17301f;--grey-bg:#212934;
  --sa:#c9a0f0;--sb:#6fd3c4;--sab:#e8ecf1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--link)}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:8px 16px}
header.top a.home{font-weight:700;text-decoration:none;color:var(--ink);white-space:nowrap}
header.top input{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
header.top button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;line-height:1.25;margin:.2em 0 .3em}
h2{font-size:1.15rem;margin:1.4em 0 .5em}
.mute{color:var(--mute)}
.warn{background:var(--amber-bg);color:var(--amber-ink);border:1px solid var(--amber-line);border-radius:10px;padding:10px 12px;font-size:.92rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;margin:10px 0}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid currentColor;vertical-align:middle;white-space:nowrap}
.b-A{color:var(--sa)}.b-B{color:var(--sb)}.b-AB{color:var(--sab)}
.b-R,.b-D{color:var(--amber-ink);background:var(--amber-bg);border-color:var(--amber-line)}
.b-L1{color:var(--l1)}.b-L2{color:var(--l2)}.b-L3{color:var(--l3)}
.clusternav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.clusternav a{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);text-decoration:none;font-size:.9rem;color:var(--ink)}
section.cluster{margin-top:22px}
section.cluster>h2{position:sticky;top:50px;background:var(--bg);padding:6px 0;margin:0;border-bottom:2px solid var(--line);z-index:5}
.topic{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.topic h3{margin:0 0 6px;font-size:1.02rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.topic h3 a{color:var(--ink);text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--grey-bg);text-decoration:none;color:var(--ink);font-size:.92rem;min-height:36px}
.chip:hover{border-color:var(--link)}
.chip .n{color:var(--mute);font-weight:700}
.chip.l1{border-left:4px solid var(--l1)}.chip.l2{border-left:4px solid var(--l2)}.chip.l3{border-left:4px solid var(--l3)}
.hubtag{font-size:.7rem;font-weight:700;color:var(--link)}
.crumb{font-size:.88rem;color:var(--mute);margin-bottom:6px}
.crumb a{color:var(--mute)}
.meta{color:var(--mute);font-size:.92rem;margin:.2em 0 .8em}
.scenario{background:var(--blue-bg);border-left:5px solid var(--link);border-radius:8px;padding:10px 14px;margin:12px 0}
.scenario b.h{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--link);margin-bottom:2px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tabs a{padding:6px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);background:var(--card);font-size:.9rem}
.tabs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.orders{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 0;margin:8px 0}
.orders .sub{font-weight:700;padding:10px 14px 2px;color:var(--mute);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em}
label.row{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
label.row:first-child{border-top:0}
label.row input{margin-top:5px;width:18px;height:18px;flex:none}
label.row .num{flex:none;min-width:1.6em;font-weight:700;color:var(--mute);text-align:right}
label.row .txt{flex:1}
label.row input:checked ~ .txt{opacity:.45;text-decoration:line-through}
.tags{display:inline-flex;gap:4px;margin-left:6px;vertical-align:baseline}
.branch{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:12px 0;overflow:hidden}
.branch .if{background:var(--red-bg);padding:9px 14px;font-weight:600;border-bottom:1px solid var(--line)}
.branch .if i,.branch .else i{font-style:normal;font-weight:800;margin-right:8px;font-size:.78rem;letter-spacing:.06em}
.branch .else{background:var(--green-bg);padding:9px 14px;font-weight:600;border-top:1px solid var(--line)}
.branch .plain{background:var(--grey-bg);padding:9px 14px;font-weight:600;border-bottom:1px solid var(--line)}
.branch .orders{border:0;border-radius:0;margin:0;background:transparent}
.branch .go{padding:8px 14px;border-top:1px solid var(--line);font-size:.93rem}
.diff{background:var(--amber-bg);color:var(--ink);border:1px solid var(--amber-line);border-radius:10px;padding:8px 14px;margin:12px 0}
.diff h3{margin:.2em 0 .3em;font-size:.95rem;color:var(--amber-ink)}
.diff ul{margin:.2em 0;padding-left:1.2em}
details.fa{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:12px 0;padding:8px 14px}
details.fa summary{cursor:pointer;font-weight:700}
details.fa ul{direction:rtl;text-align:right;font-family:Tahoma,"Segoe UI","Noto Sans Arabic","Vazirmatn",sans-serif;padding-right:1.2em;padding-left:0;line-height:1.9}
.refs{font-size:.88rem;color:var(--mute)}
.refs li{margin:2px 0}
.nav2{display:flex;justify-content:space-between;gap:8px;margin:18px 0}
.nav2 a{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;color:var(--ink)}
.nav2 a.r{text-align:right}
.topiccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}
.topiccard h3{margin:0 0 4px;font-size:1.02rem}
.topiccard p{margin:.2em 0}
.empty{padding:20px;text-align:center;color:var(--mute)}
footer{max-width:980px;margin:0 auto;padding:16px;color:var(--mute);font-size:.85rem}
@media print{header.top,.clusternav,.tabs,.nav2{display:none}label.row input{display:none}body{background:#fff}}
@media (max-width:520px){main{padding:12px}h1{font-size:1.3rem}}
</style>
</head>
<body>
<header class="top">
  <a class="home" href="#/">⚕ Orders</a>
  <input id="q" type="search" placeholder="Search condition, drug, branch…" autocomplete="off" aria-label="Search">
  <button id="theme" title="Toggle dark / light" aria-label="Toggle theme">◐</button>
</header>
<main id="app"></main>
<footer id="foot"></footer>
<script>
"use strict";
const CLUSTERS=[],TOPICS=[],VARIANTS=[];
const C=o=>CLUSTERS.push(o);
const T=o=>TOPICS.push(o);
const V=o=>VARIANTS.push(o);
C({id:'cardiac',name:'1 · Cardiac & resuscitation'});
C({id:'resp',name:'2 · Respiratory'});
C({id:'neuro',name:'3 · Neurology'});
C({id:'collapse',name:'4 · Collapse & altered consciousness'});
C({id:'tox',name:'5 · Toxicology, envenomation & allergy'});
C({id:'gi',name:'6 · GI & abdomen'});
C({id:'renal',name:'7 · Renal, urologic, metabolic & infection'});
C({id:'trauma',name:'8 · Trauma, burns & ENT'});
C({id:'vasc',name:'9 · Vascular'});

/* cardiac */
T({id:'arrest',cluster:'cardiac',name:'Cardiac arrest',src:'A',kw:'cpr vf vt pea asystole shock epinephrine amiodarone acls',desc:'Source A has one VF case. The non-shockable pathway is not in either source and is added from the AHA ACLS guideline (flagged).'});
T({id:'svt',cluster:'cardiac',name:'AVNRT / SVT',src:'A',kw:'adenosine verapamil cardioversion tachycardia narrow complex'});
T({id:'acs',cluster:'cardiac',name:'Acute coronary syndrome (ACS)',src:'B',kw:'mi stemi nstemi chest pain aspirin plavix heparin enoxaparin nitroglycerin troponin'});
T({id:'chestpain',cluster:'cardiac',name:'Chest pain — atypical / red flags',src:'B',kw:'dissection tamponade pneumothorax pe esophageal rupture'});
T({id:'ape',cluster:'cardiac',name:'Acute pulmonary edema',src:'AB',kw:'chf heart failure lasix furosemide nitroglycerin tng morphine norepinephrine dhf'});

/* resp */
T({id:'dyspnea',cluster:'resp',name:'Dyspnea — undifferentiated',src:'B',kw:'shortness of breath hub differential'});
T({id:'asthma',cluster:'resp',name:'Asthma attack',src:'B',kw:'salbutamol atrovent pulmicort magnesium wheeze bronchospasm'});
T({id:'copd',cluster:'resp',name:'COPD exacerbation',src:'B',kw:'bipap niv intubation ventilator salbutamol steroid'});
T({id:'pna',cluster:'resp',name:'Pneumonia',src:'B',kw:'cap hcap aspiration pcp aids ceftriaxone azithromycin levofloxacin vancomycin'});

/* neuro */
T({id:'stroke',cluster:'neuro',name:'Acute stroke (CVA)',src:'AB',kw:'cva ischemic hemorrhagic alteplase tpa labetalol fnd'});
T({id:'seizure',cluster:'neuro',name:'Seizure',src:'AB',kw:'status epilepticus phenytoin diazepam depakin valproate levetiracetam'});
T({id:'headache',cluster:'neuro',name:'Headache',src:'B',kw:'sah cluster migraine temporal arteritis'});
T({id:'vertigo',cluster:'neuro',name:'Vertigo',src:'B',kw:'dizziness bppv central peripheral cerebellar'});

/* collapse */
T({id:'syncope',cluster:'collapse',name:'Syncope',src:'AB',kw:'faint collapse loss of consciousness'});
T({id:'loc',cluster:'collapse',name:'Decreased level of consciousness',src:'B',kw:'coma gcs naloxone thiamine meningitis hub'});
T({id:'weakness',cluster:'collapse',name:'Generalized weakness',src:'B',kw:'gbs myasthenia botulism tick paralysis hub'});
T({id:'hypoglycemia',cluster:'collapse',name:'Hypoglycemia',src:'A',kw:'dextrose low blood sugar diabetic'});

/* tox */
T({id:'meoh',cluster:'tox',name:'Methanol / ethylene glycol poisoning',src:'A',kw:'fomepizole ethanol alcohol dialysis'});
T({id:'opioid',cluster:'tox',name:'Opioid toxicity',src:'B',kw:'naloxone overdose methadone charcoal'});
T({id:'warfarin',cluster:'tox',name:'Warfarin toxicity / high INR',src:'B',kw:'inr vitamin k ffp pcc anticoagulant bleeding'});
T({id:'snake',cluster:'tox',name:'Snake bite',src:'A',kw:'antivenom envenomation'});
T({id:'angio',cluster:'tox',name:'Angioedema / anaphylaxis',src:'A',kw:'allergy epinephrine acei hereditary c1 glucagon'});

/* gi */
T({id:'gib',cluster:'gi',name:'GI bleeding',src:'AB',kw:'hematemesis melena pantoprazole octreotide varices blakemore transfusion'});
T({id:'he',cluster:'gi',name:'Hepatic encephalopathy',src:'B',kw:'lactulose cirrhosis ammonia sbp'});
T({id:'panc',cluster:'gi',name:'Acute pancreatitis',src:'AB',kw:'amylase lipase epigastric pain'});
T({id:'epig',cluster:'gi',name:'Epigastric / RUQ pain — undifferentiated',src:'B',kw:'cholecystitis cholangitis perforation aaa mesenteric hub'});
T({id:'sbo',cluster:'gi',name:'Small bowel obstruction',src:'B',kw:'sbo ileus ngt vomiting'});
T({id:'lbo',cluster:'gi',name:'Large bowel obstruction',src:'B',kw:'lbo volvulus pseudo-obstruction'});
T({id:'rlq',cluster:'gi',name:'RLQ pain / appendicitis',src:'B',kw:'appendicitis ultrasound ct pregnant torsion'});
T({id:'hiccup',cluster:'gi',name:'Persistent hiccup',src:'A',kw:'baclofen'});

/* renal */
T({id:'colic',cluster:'renal',name:'Renal colic',src:'AB',kw:'kidney stone ketorolac morphine flank pain'});
T({id:'aki',cluster:'renal',name:'Acute kidney injury (AKI)',src:'B',kw:'prerenal postrenal dialysis oliguria'});
T({id:'rhabdo',cluster:'renal',name:'Rhabdomyolysis',src:'A',kw:'cpk myoglobin bicarbonate fluids'});
T({id:'hyperk',cluster:'renal',name:'Hyperkalemia',src:'B',kw:'potassium calcium gluconate insulin salbutamol'});
T({id:'permcath',cluster:'renal',name:'Permcath (dialysis catheter) dysfunction',src:'B',kw:'alteplase reteplase hemodialysis catheter'});
T({id:'pyelo',cluster:'renal',name:'Pyelonephritis',src:'B',kw:'uti urinary infection ciprofloxacin ceftriaxone'});
T({id:'retention',cluster:'renal',name:'Acute urinary retention',src:'A',kw:'bph foley tamsulosin'});
T({id:'dfoot',cluster:'renal',name:'Diabetic foot infection',src:'AB',kw:'gangrene clindamycin meropenem vancomycin ulcer'});

/* trauma */
T({id:'pabd',cluster:'trauma',name:'Penetrating abdominal trauma',src:'B',kw:'stab wound gunshot evisceration'});
T({id:'pchest',cluster:'trauma',name:'Penetrating chest trauma',src:'B',kw:'stab chest tube pneumothorax hemothorax'});
T({id:'face',cluster:'trauma',name:'Facial trauma',src:'B',kw:'lefort nasal fracture mandible maxilla'});
T({id:'head',cluster:'trauma',name:'Head trauma',src:'AB',kw:'gcs brain ct herniation mannitol ich skull fracture'});
T({id:'mt',cluster:'trauma',name:'Multiple trauma',src:'B',kw:'polytrauma atls tranexamic pelvis'});
T({id:'neck',cluster:'trauma',name:'Neck trauma',src:'B',kw:'hard signs soft signs nexus collar cta'});
T({id:'blunt',cluster:'trauma',name:'Blunt limb trauma',src:'B',kw:'fracture splint sedation reduction compartment'});
T({id:'plimb',cluster:'trauma',name:'Penetrating limb trauma',src:'B',kw:'open fracture hard signs gentamicin'});
T({id:'shoulder',cluster:'trauma',name:'Shoulder dislocation',src:'B',kw:'reduction sedation nerve block'});
T({id:'mandible',cluster:'trauma',name:'Mandible dislocation',src:'B',kw:'jaw reduction barton'});
T({id:'burn',cluster:'trauma',name:'Burns',src:'A',kw:'parkland escharotomy vitamin c inhalation'});
T({id:'lac',cluster:'trauma',name:'Superficial skin laceration',src:'A',kw:'suture wound cephalexin'});
T({id:'epi',cluster:'trauma',name:'Epistaxis',src:'B',kw:'nosebleed packing silver nitrate ent'});
T({id:'tetanus',cluster:'trauma',name:'Tetanus prophylaxis (shared table)',src:'B',kw:'td tetabulin vaccine immunoglobulin wound'});

/* vasc */
T({id:'ali',cluster:'vasc',name:'Arterial occlusion (acute limb ischemia)',src:'A',kw:'embolism thrombosis doppler pulseless'});

/* ============ CARDIAC ARREST ============ */
V({id:'arrest-vf',topic:'arrest',n:'Shockable (VF / pulseless VT)',src:'A',lv:'I',
 meta:'Source A case · Level I · resuscitation room',
 sc:'A 52-year-old man collapses at work. Bystander CPR is under way when EMS brings him in. He is unresponsive and pulseless. The monitor shows **ventricular fibrillation**. This is the written VF case from the Beesat sheet.',
 o:[
  'Chest compressions, high quality, minimal interruptions',
  'Cardiac monitoring / defibrillator pads on',
  '**Shock 200 J, asynchronized**, stat. Repeat as needed (VF).',
  'IV line fix (IO if no access)',
  '@D Amp **Epinephrine 1 mg** IV/IO stat, repeat every 3–5 min. Source A gives no dose.',
  'Intubation + ventilation + O2',
  'Amp **Amiodarone 300 mg** IV stat. @R A second dose of 150 mg may be given for refractory VF/VT.',
  '@D Source A also lists "Amp Dopamine 2.mg IV stat" (the number is unreadable, probably 200 mg, and dopamine is not an arrest drug). Use it only after ROSC, as a vasopressor infusion (see the branch below).',
  'Cardiology service visit',
  'Anesthesia consult',
 ],
 br:[
  {c:'ROSC achieved (pulse back)',d:[
   '@R 12-lead ECG; if STEMI, emergency cardiology / cath lab',
   '@R Avoid hypoxia and hyperoxia (SpO2 92–98%), treat hypotension (SBP ≥ 90 / MAP ≥ 65)',
   '@D Hypotensive: **dopamine** 5–20 µg/kg/min (source A listed "dopamine" without a usable dose), or norepinephrine infusion per local protocol',
   '@R Targeted temperature management, ICU admission'
  ]},
  {c:'Rhythm turns to PEA / asystole',go:['arrest-nonshockable']},
 ],
 fa:['اردر اجرا: ماساژ قلبی، مانیتورینگ، شوک ۲۰۰ ژول غیرسینکرون (قابل تکرار)، IV line، اپی‌نفرین (قابل تکرار هر ۳ تا ۵ دقیقه)، اینتوباسیون و O2، آمیودارون ۳۰۰ میلی‌گرم، ویزیت قلب و عروق، مشاوره بیهوشی.'],
 ref:['AHA 2020 Guidelines for CPR and ECC, Part 3: Adult Basic and Advanced Life Support (Panchal AR et al., Circulation 2020;142:S366). Source for epinephrine 1 mg every 3–5 min, amiodarone 300 mg then 150 mg, and post-ROSC targets.']
});
V({id:'arrest-nonshockable',topic:'arrest',n:'Non-shockable (PEA / asystole)',src:'A',lv:'I',
 meta:'Added entirely from reference. Neither source has this pathway.',
 sc:'A 70-year-old man on hemodialysis, who missed his last session, is found unresponsive by family. The monitor shows a **slow wide-complex rhythm with no pulse (PEA)**. Think hyperkalemia, hypoxia and the other reversible causes.',
 o:[
  '@R Start CPR, 30:2 until the airway is secured, then continuous compressions with 10 breaths/min',
  '@R Monitor / pads on. **No shock** for PEA or asystole.',
  '@R IV/IO access',
  '@R **Epinephrine 1 mg** IV/IO as soon as possible, then every 3–5 min',
  '@R Secure the airway (intubation or supraglottic), waveform capnography',
  '@R Rhythm check every 2 minutes',
  '@R Search for and treat the reversible causes: hypovolemia, hypoxia, acidosis (H+), hypo/hyperkalemia, hypothermia, tension pneumothorax, tamponade, toxins, thrombosis (coronary / pulmonary)',
  '@R Point-of-care ultrasound during pulse checks (tamponade, RV dilation, hypovolemia)',
 ],
 br:[
  {c:'Suspected hyperkalemia (dialysis patient, peaked T before arrest)',d:['@R Calcium gluconate / chloride IV, sodium bicarbonate, insulin + dextrose (see [[hyperk-ecg|Hyperkalemia with ECG changes]])']},
  {c:'Rhythm becomes VF / pulseless VT',go:['arrest-vf']},
  {c:'ROSC',go:['arrest-vf']},
 ],
 ref:['AHA 2020 Guidelines for CPR and ECC, Part 3 (Panchal AR et al., Circulation 2020;142:S366). PEA/asystole algorithm and reversible causes (H\'s and T\'s).']
});

/* ============ AVNRT ============ */
V({id:'svt-stable',topic:'svt',n:'Stable narrow-complex SVT',src:'A',lv:'II',
 meta:'Imp: AVNRT · Diet: NPO until stable',
 sc:'A 29-year-old woman has sudden palpitations and anxiety for 30 minutes. HR **180 regular**, BP 118/76, SpO2 98%, no chest pain. The ECG shows a regular **narrow-complex tachycardia** without visible P waves.',
 o:[
  'IV line fix, in a large proximal vein (antecubital)',
  'Cardiac monitoring + pulse oximetry',
  'ECG (12-lead; record during any drug attempt)',
  'O2 by nasal cannula 3–4 L/min only if SpO2 < 92%',
  '@R First step: vagal maneuver, modified Valsalva (strain 15 s semi-recumbent, then lie flat with legs raised)',
  'Amp **Adenosine 6 mg** IV stat, rapid push over 1–3 s, followed by **20 mL N/S flush** with the arm elevated',
  'If no response: Amp **Adenosine 12 mg** IV rapid push, followed by 20 mL N/S push with elevation. Can be repeated (source reads "x2").',
  'If still no response: Amp **Verapamil 2.5–5 mg** IV over 2 min. May repeat **5–10 mg** every 15–30 min to a **total of 20 mg**.',
 ],
 br:[
  {c:'Rhythm persists, or the patient becomes unstable (hypotension, chest pain, altered, shock)',go:['svt-unstable']},
  {c:'Wide-complex tachycardia, pre-excited AF, hypotension, or already on a beta-blocker',d:['@R Do NOT give verapamil. Treat as unstable / seek cardiology advice.']},
 ],
 fa:['در AVNRT پایدار: ابتدا آدنوزین ۶ میلی‌گرم سریع (۱ تا ۳ ثانیه) و سپس ۲۰ سی‌سی نرمال سالین فلاش با بالا نگه داشتن دست؛ در صورت عدم پاسخ ۱۲ میلی‌گرم؛ سپس وراپامیل.'],
 ref:['2015 ACC/AHA/HRS Guideline for the Management of Adult Patients with Supraventricular Tachycardia (Page RL et al., Circulation 2016;133:e506). Vagal maneuvers first; adenosine 6 then 12 mg.','REVERT trial (Appelboam A et al., Lancet 2015;386:1747). The modified Valsalva maneuver.']
});
V({id:'svt-unstable',topic:'svt',n:'Persistent or unstable → cardioversion',src:'A',lv:'I',
 meta:'Imp: AVNRT, persistent despite drugs',
 sc:'A 63-year-old man with palpitations becomes pale and diaphoretic. HR **190 regular**, BP **78/50**, confusion, chest tightness. Or: an SVT that did not convert after adenosine and verapamil.',
 o:[
  'Move to the resuscitation room, monitor + pads',
  'IV line fix, O2 if SpO2 < 92%',
  'ECG if it does not delay treatment',
  'Mild sedation (small dose, if conscious)',
  '**Synchronized DC shock 100–200 J** after mild sedation',
  'Cardiology consult',
 ],
 br:[{c:'Stable and regular narrow-complex, and drugs not yet tried',go:['svt-stable']}],
 diff:['Source A: synchronized 100–200 J. @R Current AHA guidance suggests starting at 50–100 J for regular narrow-complex SVT and escalating.'],
 ref:['2015 ACC/AHA/HRS SVT Guideline (Page RL et al., Circulation 2016;133:e506).','AHA 2020 Guidelines for CPR and ECC, Part 3: tachycardia with a pulse algorithm.']

</script>
<script>
(function(){
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const INL={A:'<span class="badge b-A">A</span>',B:'<span class="badge b-B">B</span>',AB:'<span class="badge b-AB">A+B</span>',R:'<span class="badge b-R" title="Added from reference">⚑ ref</span>',D:'<span class="badge b-D" title="Dose from reference">⚠ dose</span>'};
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[\[([a-z0-9\-]+)\|(.+?)\]\]/g,(m,id,l)=>'<a href="#/v/'+id+'">'+l+'</a>').replace(/@(AB|A|B|R|D)(?=\s|$)/g,(m,t)=>INL[t]);
const SRC={A:'A · Beesat sheet',B:'B · Isfahan booklet',AB:'A+B consensus'};
const SRCS={A:'A',B:'B',AB:'A+B'};
const byId={},topicById={},clusterById={};
CLUSTERS.forEach(c=>clusterById[c.id]=c);
TOPICS.forEach(t=>{topicById[t.id]=t;t.vs=[]});
VARIANTS.forEach(v=>{byId[v.id]=v;topicById[v.topic].vs.push(v)});
const lvCls=l=>!l?'':(/^I(?![I])/.test(l)?'l1':(/^II/.test(l)?'l2':'l3'));
function badge(src){return '<span class="badge b-'+src+'" title="'+SRC[src]+'">'+SRCS[src]+'</span>'}
function lvBadge(l){if(!l)return '';const c=lvCls(l);return '<span class="badge b-L'+(c==='l1'?1:c==='l2'?2:3)+'" title="Triage level used in the sheets (I = resuscitation room, II = urgent, III = less urgent)">Level '+l+'</span>'}
function parseTags(s){const t=[];let m;while((m=s.match(/^@(AB|A|B|R|D)\s+/))){t.push(m[1]);s=s.slice(m[0].length)}return{t,s}}
function tagHtml(t,defSrc){
  return t.map(x=>{
    if(x==='R')return '<span class="badge b-R" title="Added from a published reference because the source files do not give it. Verify against your local protocol.">⚑ added from reference</span>';
    if(x==='D')return '<span class="badge b-D" title="The handwritten value was unreadable or implausible. The standard reference dose is shown. Verify before use.">⚠ dose from reference</span>';
    if(defSrc==='AB'||x!==defSrc)return badge(x);
    return '';
  }).join(' ');
}
function rows(items,defSrc,startN){
  let n=startN||0,h='<div class="orders">';
  items.forEach(it=>{
    if(it.startsWith('## ')){h+='<div class="sub">'+fmt(it.slice(3))+'</div>';return}
    const p=parseTags(it);n++;
    const tg=tagHtml(p.t,defSrc);
    h+='<label class="row"><input type="checkbox"><span class="num">'+n+'</span><span class="txt">'+fmt(p.s)+(tg?'<span class="tags">'+tg+'</span>':'')+'</span></label>';
  });
  return h+'</div>';
}
function goLinks(go){
  if(!go||!go.length)return '';
  return '<div class="go">→ '+go.map(id=>{const v=byId[id];return v?'<a href="#/v/'+id+'">'+esc(topicById[v.topic].name+' — '+v.n)+'</a>':'<b>?'+esc(id)+'</b>'}).join(' · ')+'</div>';
}
function branches(list,defSrc){
  return list.map(b=>{
    let h='<div class="branch">';
    if(b.c)h+='<div class="if"><i>IF</i>'+fmt(b.c)+'</div>';
    else if(b.t)h+='<div class="plain">'+fmt(b.t)+'</div>';
    if(b.d&&b.d.length)h+=rows(b.d,defSrc);
    if(b.e&&b.e.length)h+='<div class="else"><i>OTHERWISE</i>'+(b.ec?fmt(b.ec):'')+'</div>'+rows(b.e,defSrc);
    h+=goLinks(b.go)+'</div>';
    return h;
  }).join('');
}
function viewIndex(q){
  q=(q||'').trim().toLowerCase();
  let h='';
  if(!q){
    h+='<h1>Emergency Orders — Quick Access</h1>';
    h+='<div class="warn"><b>Reference aid only.</b> Not a substitute for clinical judgement or local protocol. Verify every dose marked ⚠ (dose from reference) or ⚑ (added from reference).</div>';
    h+='<p class="mute">Pick a topic, then the variant that matches your patient. Each variant opens with a typical scenario, then orders, then IF / OTHERWISE branches.</p>';
    h+='<div class="clusternav">'+CLUSTERS.map(c=>'<a href="#c-'+c.id+'" data-jump="'+c.id+'">'+esc(c.name)+'</a>').join('')+'</div>';
    h+='<details class="fa" style="direction:ltr"><summary>Legend</summary><div class="legend"><span>'+badge('A')+' Beesat handout</span><span>'+badge('B')+' Isfahan booklet 2019</span><span>'+badge('AB')+' both sources, consensus</span><span><span class="badge b-D">⚠ dose from reference</span> handwriting unreadable</span><span><span class="badge b-R">⚑ added from reference</span> not in sources</span><span>'+lvBadge('I')+' resus · '+lvBadge('II')+' urgent · '+lvBadge('III')+' lower</span></div></details>';
  }
  let shown=0;
  CLUSTERS.forEach(c=>{
    const ts=TOPICS.filter(t=>t.cluster===c.id).filter(t=>{
      if(!q)return true;
      const hay=(t.name+' '+(t.kw||'')+' '+t.vs.map(v=>v.n+' '+(v.kw||'')).join(' ')).toLowerCase();
      return q.split(/\s+/).every(w=>hay.includes(w));
    });
    if(!ts.length)return;
    h+='<section class="cluster" id="c-'+c.id+'"><h2>'+esc(c.name)+'</h2>';
    ts.forEach(t=>{
      shown++;
      h+='<div class="topic"><h3><a href="#/t/'+t.id+'">'+esc(t.name)+'</a> '+badge(t.src)+'</h3><div class="chips">';
      t.vs.forEach((v,i)=>{h+='<a class="chip '+lvCls(v.lv)+'" href="#/v/'+v.id+'"><span class="n">'+'①②③④⑤⑥⑦⑧⑨⑩'[i]+'</span>'+esc(v.n)+(v.hub?' <span class="hubtag">HUB</span>':'')+'</a>'});
      h+='</div></div>';
    });
    h+='</section>';
  });
  if(!shown)h+='<div class="empty">No topic matches “'+esc(q)+'”.</div>';
  app.innerHTML=h;
  document.title='Emergency Orders Quick Access';
}
function viewTopic(id){
  const t=topicById[id];if(!t)return viewIndex();
  const c=clusterById[t.cluster];
  let h='<div class="crumb"><a href="#/">Contents</a> / <a href="#c-'+c.id+'" data-jump="'+c.id+'">'+esc(c.name)+'</a></div>';
  h+='<h1>'+esc(t.name)+' '+badge(t.src)+'</h1>';
  if(t.desc)h+='<p class="mute">'+fmt(t.desc)+'</p>';
  h+='<h2>Which variant matches your patient?</h2>';
  t.vs.forEach((v,i)=>{
    h+='<div class="topiccard"><h3><a href="#/v/'+v.id+'">'+'①②③④⑤⑥⑦⑧⑨⑩'[i]+' '+esc(v.n)+'</a> '+badge(v.src)+' '+lvBadge(v.lv)+(v.hub?' <span class="hubtag">HUB</span>':'')+'</h3><p>'+fmt(v.sc||'')+'</p></div>';
  });
  app.innerHTML=h;document.title=t.name+' · Emergency Orders';
}
function viewVariant(id){
  const v=byId[id];if(!v)return viewIndex();
  const t=topicById[v.topic],c=clusterById[t.cluster];
  const i=t.vs.indexOf(v);
  let h='<div class="crumb"><a href="#/">Contents</a> / <a href="#c-'+c.id+'" data-jump="'+c.id+'">'+esc(c.name)+'</a> / <a href="#/t/'+t.id+'">'+esc(t.name)+'</a></div>';
  h+='<h1>'+esc(t.name)+' — '+esc(v.n)+'</h1><div>'+badge(v.src)+' '+lvBadge(v.lv)+(v.hub?' <span class="badge b-AB">decision hub</span>':'')+'</div>';
  if(v.meta)h+='<div class="meta">'+fmt(v.meta)+'</div>';
  if(t.vs.length>1){h+='<div class="tabs">'+t.vs.map((x,j)=>'<a class="'+(x===v?'on':'')+'" href="#/v/'+x.id+'">'+'①②③④⑤⑥⑦⑧⑨⑩'[j]+' '+esc(x.n)+'</a>').join('')+'</div>'}
  if(v.sc)h+='<div class="scenario"><b class="h">Scenario</b>'+fmt(v.sc)+'</div>';
  if(v.o&&v.o.length){h+='<h2>Orders</h2>'+rows(v.o,v.src)}
  if(v.br&&v.br.length){h+='<h2>'+(v.hub?'Branches':'If / otherwise')+'</h2>'+branches(v.br,v.src)}
  if(v.diff&&v.diff.length){h+='<div class="diff"><h3>Where the two sources differ</h3><ul>'+v.diff.map(d=>'<li>'+fmt(d)+'</li>').join('')+'</ul></div>'}
  if(v.fa&&v.fa.length){h+='<details class="fa"><summary>یادداشت‌های فارسی (Persian notes from the sources)</summary><ul>'+v.fa.map(d=>'<li>'+fmt(d)+'</li>').join('')+'</ul></details>'}
  const refs=(v.ref||[]).concat(t.ref||[]);
  if(refs.length){h+='<h2>References for flagged items</h2><ul class="refs">'+refs.map(r=>'<li>'+fmt(r)+'</li>').join('')+'</ul>'}
  if(t.vs.length>1){
    const p=t.vs[i-1],n=t.vs[i+1];
    h+='<div class="nav2">'+(p?'<a href="#/v/'+p.id+'">← '+esc(p.n)+'</a>':'<span></span>')+(n?'<a class="r" href="#/v/'+n.id+'">'+esc(n.n)+' →</a>':'<span></span>')+'</div>';
  }
  app.innerHTML=h;document.title=t.name+' — '+v.n;
}
function route(){
  const hs=location.hash||'#/';
  let m;
  if((m=hs.match(/^#\/v\/([a-z0-9\-]+)$/)))viewVariant(m[1]);
  else if((m=hs.match(/^#\/t\/([a-z0-9\-]+)$/)))viewTopic(m[1]);
  else viewIndex($('#q').value);
  if(!hs.startsWith('#c-'))window.scrollTo(0,0);
}
addEventListener('hashchange',route);
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-jump]');
  if(a){e.preventDefault();const el=document.getElementById('c-'+a.dataset.jump);
    if(el){el.scrollIntoView()}else{location.hash='#/';setTimeout(()=>{const x=document.getElementById('c-'+a.dataset.jump);x&&x.scrollIntoView()},0)}}
});
$('#q').addEventListener('input',()=>{if(!/^#\/$|^$/.test(location.hash))location.hash='#/';else viewIndex($('#q').value)});
$('#theme').addEventListener('click',()=>{
  const r=document.documentElement,cur=r.getAttribute('data-theme');
  const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.setAttribute('data-theme',dark?'light':'dark');
});
$('#foot').innerHTML='Sources: <b>A</b> = Physician Orders Sheet handout, Beesat Educational-Therapeutic Center (Hamadan University of Medical Sciences, Ibn Sina). <b>B</b> = “Common Emergency Orders” booklet, Emergency Medicine Dept., Isfahan University of Medical Sciences, Winter 1398 (based on Rosen’s 2018). Scenarios are illustrative teaching cases written for this page. Items tagged ⚑ / ⚠ come from the cited references, not from the handouts.';
route();
})();
</script>
