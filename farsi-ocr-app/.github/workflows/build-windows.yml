name: Build Windows installer

on:
  workflow_dispatch: {}
  push:
    branches:
      - "**"
    paths:
      - "farsi-ocr-app/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: farsi-ocr-app
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Tesseract OCR engine (for bundling only)
        run: |
          choco install tesseract --no-progress -y

      - name: Locate Tesseract install directory
        id: tess
        run: |
          $exe = (Get-Command tesseract.exe -ErrorAction SilentlyContinue).Source
          if (-not $exe) { $exe = "C:\Program Files\Tesseract-OCR\tesseract.exe" }
          if (-not (Test-Path $exe)) { throw "tesseract.exe not found after choco install" }
          $dir = Split-Path $exe -Parent
          Write-Host "Tesseract dir: $dir"
          echo "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Build with PyInstaller
        run: |
          $tessDir = "${{ steps.tess.outputs.dir }}"
          pyinstaller --noconfirm --windowed --name FarsiOCR `
            --add-data "assets/tessdata;assets/tessdata" `
            --add-data "$tessDir;tesseract_bin" `
            main.py

      - name: Verify bundled Tesseract binary
        run: |
          if (-not (Test-Path "dist\FarsiOCR\_internal\tesseract_bin\tesseract.exe")) {
            if (-not (Test-Path "dist\FarsiOCR\tesseract_bin\tesseract.exe")) {
              throw "Bundled tesseract.exe missing from PyInstaller output"
            }
          }

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarsiOCR-Setup
          path: farsi-ocr-app/installer_output/FarsiOCR-Setup.exe
          if-no-files-found: error
