<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tintinalli-based orders</title>
<meta name="description" content="ED order sets built from Tintinalli's Emergency Medicine Manual, in the Imp / Cond / Act / Diet + NILSTATCo format, with clinical features, DDx, case simulation and study guides.">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/t.css">
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<header class="top">
  <a class="home" href="#/" aria-label="Home"><span class="mk" aria-hidden="true">Rx</span><span>Orders</span></a>
  <input id="q" type="search" placeholder="Search condition, drug, test… ( / )" autocomplete="off" aria-label="Search">
  <details class="pop">
    <summary aria-label="Display settings">Aa</summary>
    <form id="set-form" class="popbox" onsubmit="return false">
      <div class="row"><span>Text size <b id="fs-val">100%</b></span><span><button type="button" data-act="fs-down" aria-label="Smaller text">A−</button> <button type="button" data-act="fs-up" aria-label="Larger text">A+</button></span></div>
      <label class="row"><span>High contrast</span><input type="checkbox" name="contrast"></label>
      <label class="row"><span>Large touch targets</span><input type="checkbox" name="touch"></label>
      <label class="row"><span>Show “why” under orders</span><input type="checkbox" name="why"></label>
      <label class="row"><span>Theme</span><select name="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label class="row"><span>Page direction</span><select name="dir"><option value="ltr">Left to right</option><option value="rtl">Right to left</option></select></label>
    </form>
  </details>
  <a class="shbtn" id="shbtn" href="#/shift" hidden aria-label="Shift board"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M9 3.5h6v2.5H9zM8 11h3M8 15h3M14 11h2M14 15h2"/></svg><b id="shn">0</b></a>
  <a class="btn gho" href="../" title="Choose the other part of the site" aria-label="Switch site">⌂</a>
</header>
<nav id="nav" aria-label="Main"><a href="#/">Complaints</a><a href="#/shift">Shift board</a><a href="#/case">Case simulator</a><a href="#/test">Self-test</a><a href="#/calc">Calculators</a><a href="#/my">My study</a><a href="#/about">About</a></nav>
<main id="app" tabindex="-1"><div class="skel" style="width:40%;height:1.6em"></div><div class="skel"></div><div class="skel" style="width:75%"></div></main>
<footer id="foot"></footer>
<nav id="tabs" aria-label="Sections">
  <a href="#/" data-tab=""><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Complaints</span></a>
  <a href="#/q" data-tab="q"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg><span>Search</span></a>
  <a href="#/case" data-tab="case"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-7 4 14 2.5-7h5"/></svg><span>Case</span></a>
  <a href="#/shift" data-tab="shift"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M9 3.5h6v2.5H9zM8 11h3M8 15h3M14 11h2M14 15h2"/></svg><span>Shift</span></a>
  <a href="#/my" data-tab="my"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.8l5.9-.8z"/></svg><span>My study</span></a>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="dist/meta.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/core.js"></script>
<script src="js/calc.js"></script>

<script src="js/shift.js"></script>
<script src="js/app.js"></script>
</body>
</html>
