name: Build content bundle

# Runs whenever you add or edit a topic, a reference, or the cluster list.
# It validates everything and regenerates content/bundle.js, which the website reads.
on:
  push:
    branches: [main]
    paths:
      - 'content/topics/**'
      - 'content/references.md'
      - 'content/clusters.txt'
      - 'tools/**'
      - 'js/parser.js'
  pull_request:
    paths:
      - 'content/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate and build
        id: build
        continue-on-error: true
        run: node tools/build.js
      - name: Commit the new bundle (main branch only)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/bundle.js
          if git diff --cached --quiet; then echo "bundle unchanged"; else git commit -m "Update content bundle [skip ci]" && git push; fi
      - name: Fail if the content has problems
        if: steps.build.outcome == 'failure'
        run: |
          echo "Open the 'Validate and build' step above to see which file has a problem."
          exit 1
